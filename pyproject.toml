[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research-lab"
version = "0.1.0"
description = "Python starter collector for BIST market research data."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "yfinance>=0.2.54",
    "pyarrow>=17.0",
    "scipy>=1.13",
]

[project.scripts]
bist-collector = "bist_research.collector:main"
bist-features = "bist_research.features:main"
bist-backtest = "bist_research.backtest.cli:main"
bist-research = "bist_research.research.cli:main"
bist-signals = "bist_research.signals.cli:main"
bist-portfolio = "bist_research.portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
